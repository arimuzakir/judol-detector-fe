name: CI/CD Vue Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue.js Project
        run: npm run build

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/judol-detector-fe:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke Server (via SSH)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Mulai deploy Vue.js di server $(hostname)"
            sudo systemctl start docker || true

            echo "🔐 Login ke GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📦 Pull image..."
            sudo docker pull ghcr.io/${{ github.repository_owner }}/judol-detector-fe:latest

            sudo docker stop judol-detector-fe || true
            sudo docker rm judol-detector-fe || true
            sudo docker run -d \
              --name judol-detector-fe \
              -p 80:80 \
              ghcr.io/${{ github.repository_owner }}/judol-detector-fe:latest

            echo "✅ Deployment Vue.js frontend selesai!"
            sudo docker ps -a

