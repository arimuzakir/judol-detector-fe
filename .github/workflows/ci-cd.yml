name: CI/CD Vue Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Vue.js Project
        run: npm run build

      - name: 🗜️ Compress build output
        run: |
          tar -czf dist.tar.gz dist

      - name: 📤 Upload artifact (optional, debugging)
        uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: dist.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-dist

      - name: 🚀 Deploy ke Server (tanpa Docker)
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist.tar.gz"
          target: "/tmp/"

      - name: ⚙️ Ekstrak dan deploy di server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploy frontend Vue di $(hostname)"

            # Buat folder root (pakai sudo biar aman)
            sudo mkdir -p /var/www/judol-frontend
            sudo chown -R $USER:$USER /var/www/judol-frontend

            echo "🗜️ Extracting dist.tar.gz..."
            sudo tar -xzf /tmp/dist.tar.gz -C /var/www/judol-frontend --strip-components=1

            echo "🧹 Cleanup..."
            sudo rm -f /tmp/dist.tar.gz

            echo "🔄 Reload Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Frontend Vue.js berhasil di-deploy!"
